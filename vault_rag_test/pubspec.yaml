name: vault_rag_test
description: Zero-trust on-device RAG test build — iQOO Hackathon 2026 prep.
publish_to: 'none'
version: 0.1.0

environment:
  # file_picker 12.x and path_provider 2.1.6 both require Dart >= 3.10.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 0.12.x pulls the native LiteRT binaries from Maven itself, so the manual
  # jniLibs install script older guides describe is no longer needed.
  tflite_flutter: ^0.12.1
  # Deliberately on sqlite3 2.x + sqlite3_flutter_libs. sqlite3 3.x replaces
  # that plugin with Dart build hooks, which are still experimental for
  # Flutter Android — not what you want the night before a hackathon.
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  # SHA-256 / HMAC-SHA256 for the canonical capsule digest and VaultLink key
  # derivation. Already in the lockfile as a transitive dependency of
  # flutter_test tooling; declared directly now that lib/ imports it. Pure
  # Dart, dart-lang maintained, no native code, no network.
  crypto: ^3.0.6
  # FFI string marshalling for the QNN HTP delegate shim
  # (lib/core/qnn/qnn_htp_delegate.dart). Already locked transitively via
  # tflite_flutter; declared because lib/ now imports it directly.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drives the 20-second clipboard TTL in tests without waiting 20 seconds.
  # Already resolved transitively by flutter_test.
  fake_async: ^1.3.0

flutter:
  # `airgap` has zero network permissions in release; `lan` keeps INTERNET
  # for the WebSocket bridge. See android/app/build.gradle.kts.
  default-flavor: airgap
  uses-material-design: true
  assets:
    - assets/models/minilm_l6_v2.tflite
    - assets/models/vocab.txt
